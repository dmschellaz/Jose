name: Redline
options:
  bundleIdPrefix: com.dmschellaz
  deploymentTarget:
    macOS: "26.0"
packages:
  RedlineCore:
    path: Packages/RedlineCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.4.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Redline:
    type: application
    platform: macOS
    sources: [App/Redline]
    dependencies:
      - package: RedlineCore
      - package: KeyboardShortcuts
    info:
      path: App/Redline/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Redline
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Redline listens to your narration while you record feedback. Audio is transcribed on your Mac and never saved."
        NSSpeechRecognitionUsageDescription: "Redline turns your narration into text on your Mac."
        NSAppleEventsUsageDescription: "Redline reads the current tab's address from your browser so feedback can say which page it's about."
    entitlements:
      path: App/Redline/Redline.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmschellaz.redline
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
